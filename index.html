function parseTarget(t){const m=/(\d+)\s*[x×]\s*(\d+)\s*(s|sek|min)?(?![a-ząćęłńóśźż])/i.exec(t||'');if(!m)return null;const u=(m[3]||'').toLowerCase();return{n:+m[1],r:+m[2],mode:u?'time':null,sec:u==='min'?+m[2]*60:u?+m[2]:0}}
function guessMode(n){n=n||'';if(/Deska|Plank|Wall sit|Zwis|Hollow/i.test(n))return'time';if(/Pompki|Podciąganie|Dipy|Burpees|Martwy robak|Superman|Wiosłowanie australijskie/i.test(n)&&!/hantl|sztang|obciąż/i.test(n))return'reps';if(/^(Przysiad|Wykroki|Most biodrowy|Wspięcia na palce|Przysiad z wyskokiem)$/i.test(n.trim()))return'reps';return'kg'}
const emptySet=()=>({kg:'',reps:'',sec:'',ok:false});
function newEx(name,target){const t=parseTarget(target),l=lastEx(name),mode=t?.mode||(l?exMode(l.e):guessMode(name)),n=t?.n||(l?l.e.sets.length:3);return{name:name||'',mode,on:true,target:target||'',sets:[...Array(Math.min(10,n))].map(emptySet)}}
const COLS={kg:[['kg','kg','decimal','0.5'],['reps','Powt.','numeric','1']],reps:[['reps','Powtórzenia','numeric','1']],time:[['sec','Sekundy','numeric','5']]};
function exCtx(e,skipId){const m=exMode(e),l=lastEx(e.name,skipId);return{m,l,lm:l&&exMode(l.e)===m?l.e:null,t:parseTarget(e.target)}}
function phFor(e,j,k,c){const ls=c.lm&&c.lm.sets[Math.min(j,c.lm.sets.length-1)];if(ls&&+ls[k])return ls[k];if(c.t){if(k==='reps'&&c.t.mode!=='time')return c.t.r;if(k==='sec'&&c.t.sec)return c.t.sec}const pv=j>0&&e.sets[j-1];if(pv&&pv[k]!==''&&pv[k]!=null)return pv[k];return''}

function pickGroups(){
  const seen=new Set(),out=[],add=(t,list)=>{const l=[];for(const n of list){const k=norm(n);if(!n||seen.has(k))continue;seen.add(k);l.push(n)}if(l.length)out.push([t,l])};
  const p=plan(),td=p?.days?.[dow(S.draft?.date||today())];
  add('Z planu na ten dzień',(td?.ex||[]).map(e=>e.name));add('Twoje ćwiczenia',exNames());add('Z Twojego planu',(p?.days||[]).flatMap(d=>(d.ex||[]).filter(()=>d.type!=='cardio').map(e=>e.name)));
  for(const[g,ps]of PGRP)add(g,ps.flatMap(x=>['gym','db','bw'].flatMap(q=>EXP[x][q])));
  return out;
}

async function aiCards(sid){
  const s=subj(sid),tp=topics(sid);if(!S.sample||!s||!tp.length)return;

    const r=await S.sample.json(`Jesteś asystentem do nauki dla studenta. Przedmiot: "${s.name}". Tematy:\n${tp.slice(0,40).map(t=>'- '+t.title).join('\n')}\n\nUtwórz do 15 fiszek po polsku, po 1–2 na temat: krótkie, konkretne pytanie i poprawna, zwięzła odpowiedź (maks. 2–3 zdania). Pomiń tematy, których znaczenia nie jesteś pewien. Odpowiedz wyłącznie tablicą JSON: [{"front": "pytanie", "back": "odpowiedź"}].`);
    const list=(Array.isArray(r)?r:[]).filter(c=>c&&c.front&&c.back&&!have.has(norm(c.front))).slice(0,15).map((c,i)=>({id:rid('c'),kind:'card',subject:sid,front:String(c.front).slice(0,300),back:String(c.back).slice(0,1200),box:0,due:'',created:Date.now()+i,ai:true}));

  }catch(e){S.aiCards='';const c=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c))S.sample=null;render();if(c!=='cancelled'&&S.sample)toast(c==='rate_limited'?'Za dużo zapytań. Spróbuj za chwilę.':'Nie udało się utworzyć fiszek. Spróbuj jeszcze raz.','err')}

function revAnswer(v){
  const r=S.rev;if(!r)return;const id=r.queue.shift(),c=clone(S.items.get(id));if(!c)return renderModal();

}

const actOf=d=>S.items.get('a_'+d)||{id:'a_'+d,kind:'activity',date:d};
function parseHealth(t){
  const n=s=>+String(s).replace(/\s/g,'').replace(',','.'),o={};let m;t=String(t||'');
  if((m=/(?:kroki|kroków|steps)\D{0,14}?(\d[\d\s.]{0,8})/i.exec(t)))o.steps=Math.round(n(m[1].replace(/\.(?=\d{3})/g,'')));
  if((m=/(?:sen|snu|sleep)\D{0,14}?(\d+(?:[.,]\d+)?)\s*(h|godz|min)?/i.exec(t))){let v=n(m[1]);if(/min/i.test(m[2]||'')||v>24)v=v/60;o.sleep=+v.toFixed(1)}
  if((m=/(?:kcal|kalorie|aktywn\w*|active|energia)\D{0,14}?(\d[\d\s]{0,6})/i.exec(t)))o.kcal=Math.round(n(m[1]));
  for(const k in o)if(!isFinite(o[k])||o[k]<0)delete o[k];return o;
}

document.addEventListener('click',e=>{
  if(Date.now()-S.suppressClick<350){e.preventDefault();return}
  const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(!f)return;
  const inModal=!!b.closest('#modal');
  if(S.modal&&!inModal&&b.dataset.act!=='closeModal')closeModal();
  if(S.modal&&inModal&&!S.modal.onSave&&!S.modal.keep&&b.dataset.act!=='closeModal')closeModal();
  e.preventDefault();f(b,e)});
function onField(e){
  const el=e.target;
  if(el.dataset.pick!=null&&S.pick&&e.type==='change'){const k=norm(el.dataset.pick);el.checked?S.pick.sel.add(k):S.pick.sel.delete(k);const g=$('#pick-go');if(g)g.textContent=`Gotowe (${S.pick.sel.size})`;return}
  if(el.id==='pick-q'&&S.pick&&e.type==='input'){S.pick.q=el.value;const l=$('#pick-list');if(l)l.innerHTML=pickList();return}
  if(el.dataset.f&&S.draft){setP(S.draft,el.dataset.f,el.type==='checkbox'?el.checked:el.value);
    if(el.dataset.f==='place'&&S.draft.kind==='event'){const pl=placeOf(el.value);S.draft.travel=pl?pl.min:0}
    if(el.dataset.f==='paste'&&e.type==='input'){const o=parseHealth(el.value);for(const k in o){S.draft[k]=o[k];const n=$('#f-'+k);if(n)n.value=o[k]}}
    if(e.type==='change'&&el.dataset.rr)renderModal();
    if(el.dataset.f==='q'&&e.type==='input'){const s=$('#fsug');if(s)s.innerHTML=sugHTML()}
    if(el.dataset.f==='g'&&S.draft.base){baseCalc();for(const k of['name','amt','kcal','p','c','f']){const n=$('#f-'+k);if(n)n.value=S.draft[k]}}
    if(/^ai\.\d+\.on$/.test(el.dataset.f))renderModal();
    if(['name','kcal','p','c','f'].includes(el.dataset.f)&&S.draft.base&&e.type==='input'&&el.dataset.f!=='name')S.draft.base=null;
  }
  if(el.dataset.wz&&S.wz)S.wz.ans[el.dataset.wz]=el.value;
  if(el.dataset.wzAi&&S.wz)S.wz.ai=el.checked;
  if(el.dataset.wzSw&&S.wz)S.wz.saveW=el.checked;
  if(el.id==='qadd-in')S.qText=el.value;
  if(el.id==='qm-in')S.qm=el.value;
  if(e.type==='change'&&el.dataset.act2==='mod'){const st=clone(settings());st.mods={...(st.mods||{}),[el.dataset.k]:el.checked};put(st)}
  if(el.id==='qadd-due')S.qDue=el.value;
  if(el.id==='prog-ex'&&e.type==='change'){S.progEx=el.value;delete S.chartSel.ex;render()}
  if(el.id==='import-file'&&e.type==='change'){readImport(el.files&&el.files[0]);el.value=''}
  if(el.id==='fsearch'&&e.type==='input'){S.fq=el.value;S.user?.search(el.value).then(r=>{S.searchRes=r||[];const u=$('#fres');if(u)u.innerHTML=searchHTML()})}
  if(e.type==='change'&&el.dataset.act2==='planRemind'){const p=clone(plan());p.remind=el.checked;put(p)}
  if(e.type==='change'&&el.dataset.act2==='share'){const st=clone(settings());st.share=el.checked;put(st);toast(el.checked?'Znajomi widzą Twoje treningi':'Treningi ukryte przed znajomymi')}
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('focusin',e=>{if(e.target.id==='fsearch'&&S.user&&!S.fq)S.user.search('').then(r=>{S.searchRes=r||[];const u=$('#fres');if(u)u.innerHTML=searchHTML()})});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='mform'&&S.modal?.onSave){if(S.modal.onSave(S.draft)===true)closeModal()}
  if(e.target.id==='qmeal'){const v=(S.qm||'').trim();if(!v){$('#qm-in')?.focus();return}S.qm='';S.dietDay=today();foodModal();if(S.sample){S.draft.desc=v;renderModal();aiFood()}else{S.draft.q=v;renderModal()}return}
  if(e.target.id==='qadd'){const t=S.qText.trim();if(!t)return;const due=S.qDue==='t'?today():S.qDue==='j'?addD(today(),1):'';
    put({id:rid('t'),kind:'task',title:t.slice(0,140),notes:'',cat:S.taskCat||'osobiste',prio:2,due,time:'',repeat:'none',remind:false,subs:[],subject:'',done:false,created:Date.now()});S.qText='';const i=$('#qadd-in');if(i){i.value='';i.focus()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal()});

/* ---------- boot ---------- */
async function init(){
  render();
  let db=null,user=null;const cl=window.claude;
  if(cl&&typeof cl.use==='function'){
    try{[db,user]=await Promise.all([cl.use('db'),cl.use('user')])}catch(e){}
    cl.use('sample').then(s=>{S.sample=s;if(S.loaded&&s&&S.view==='studia')render()}).catch(()=>{});
    cl.use('downloads').then(d=>{S.dl=d}).catch(()=>{});
  }
  S.user=user;
  if(user){try{S.me=await user.me();S.uid=S.me.id}catch(e){}}
  if(db&&S.uid){
    S.db=db;S.mode='db';S.col=db.collection('data/users/'+S.uid);
    S.col.onSnapshot(snap=>{S.items=new Map(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));const first=!S.loaded;S.loaded=true;if(first)S.enterNext=true;if(!dr&&!sw?.on)render();checkRem();schedulePublic()},
      err=>{if(err?.code==='revoked')S.mode='local';toast('Utracono połączenie z danymi. Odśwież stronę.','err',8000)});
    db.collection('public').onSnapshot(snap=>{S.people=new Map(snap.docs.map(d=>[d.id,d.data()]));
      if(!S.publicLoaded){const mine=S.people.get(S.uid);S.publicJSON=mine?stable(mine):null;S.publicLoaded=true;schedulePublic()}
      if(S.view==='znajomi'&&!S.modal)render()},()=>{});
  }else{S.mode='local';loadLocal();S.loaded=true;S.enterNext=true;render();checkRem()}
}
setInterval(checkRem,20000);
init();
})();
