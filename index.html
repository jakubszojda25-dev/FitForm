<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="description" content="Zadania, treningi, dieta, nawyki, studia i kalendarz w jednym miejscu.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forma">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}</style>
<title>Forma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: grouped glass sidebar + roomy main column on desktop; on phone a top bar, a glass tab bar and bottom sheets. Premium dark: near-black ink, soft lit surfaces, one gradient per life area. */
:root{
  --bg:#07080B; --surface:#10131A; --surface-2:#171B24; --surface-3:#1E2330;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12); --hi:rgba(255,255,255,.05);
  --fg:#EEF0F6; --muted:#8C94A8; --faint:#555D72; --on-accent:#0C0E13;
  --task:#8E96FF; --gym:#FFB04A; --study:#3FD0B4; --food:#FF7E6B; --body-c:#62BFFF; --habit:#C59BFF;
  --danger:#FF6464; --ok:#55DB93;
  --c-dom:#C59BFF; --c-osob:#FF8FB8;
  --s1:#3FD0B4; --s2:#8E96FF; --s3:#FFB04A; --s4:#FF8FB8; --s5:#62BFFF; --s6:#C59BFF;
  --g-task:linear-gradient(90deg,#7C86FF,#B49CFF); --g-gym:linear-gradient(90deg,#FFC04D,#FF7A45);
  --g-food:linear-gradient(90deg,#FF9D6B,#FF5C8A); --g-study:linear-gradient(90deg,#34D1B0,#58C8F0);
  --g-body:linear-gradient(90deg,#5CC0FF,#7E9BFF); --g-habit:linear-gradient(90deg,#B98CFF,#F08CF5);
  --g-ok:linear-gradient(90deg,#4FD98C,#2FC6A8); --g-c:linear-gradient(90deg,#E8C8FF,#FF8FB8);
  --g-fg:linear-gradient(135deg,#FFFFFF,#D9DDEA);
  --display:'Sora','Segoe UI',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:20px; --r-sm:12px;
  --shadow:0 1px 0 var(--hi) inset,0 18px 40px -24px rgba(0,0,0,.75);
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(1100px 560px at 12% -8%,rgba(124,134,255,.11),transparent 62%),radial-gradient(900px 520px at 105% -4%,rgba(255,122,69,.07),transparent 60%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--task);outline-offset:2px;border-radius:8px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-block:26px 18px;padding-right:14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand b{font:700 21px/1 var(--display);letter-spacing:-.03em}
.mark{display:flex;gap:3px;align-items:flex-end;height:20px}
.mark i{display:block;width:5px;border-radius:3px}
.mark i:nth-child(1){height:11px;background:#8E96FF}
.mark i:nth-child(2){height:20px;background:#FFB04A}
.mark i:nth-child(3){height:15px;background:#3FD0B4}
.glabel{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 12px 5px}
.side .brand+.glabel{padding-top:0}
.nav{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:12px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.nav.on{color:var(--fg);background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 var(--hi)}
.side .nav.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--hue,var(--fg))}
.nav.on .i{color:var(--hue,var(--fg))}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font:600 11px var(--mono);color:var(--fg);background:rgba(255,255,255,.08)}
.side .grow{flex:1;min-height:16px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.who img,.av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);object-fit:cover;flex:none}
.who strong{color:var(--fg);display:block;font-size:13.5px}
.main{min-width:0;padding-block:34px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.main{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.tabbar,.fab,.topbar{display:none}
.choose button.cur{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
@media (max-width:759px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-block:12px calc(128px + env(safe-area-inset-bottom,0px))}
  .wrap{gap:20px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto 14px}
  .topbar .brand{padding:0}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;padding:6px;border-radius:22px;background:rgba(18,21,29,.82);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line-2);box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
  .tabbar .nav{flex-direction:column;justify-content:center;gap:3px;height:52px;padding:0;font-size:10.5px;text-align:center;border-radius:16px}
  .tabbar .nav.on{background:rgba(255,255,255,.08)}
  .fab{display:grid;place-items:center;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--g-fg);color:var(--on-accent);box-shadow:0 14px 30px -8px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.25) inset;cursor:pointer}
  .fab .i{width:24px;height:24px;stroke-width:2.4}
}

/* type */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.vh h1{margin:0;font:600 clamp(25px,4vw,34px)/1.1 var(--display);letter-spacing:-.035em;text-wrap:balance}
.vh .sub{color:var(--muted);margin-top:6px;font-size:14px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h2.sec{margin:0;font:600 15px/1.2 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h2.sec .count{font:600 12px var(--mono);color:var(--muted)}
.muted{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* surfaces */
.panel{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:rgba(255,255,255,.015)}
.empty .ill{display:flex;gap:6px;align-items:flex-end;height:44px}
.empty .ill i{display:block;width:12px;border-radius:4px;background:var(--c,var(--line-2));opacity:.85}
.empty strong{color:var(--fg);font-size:15px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 var(--hi);transition:transform .12s,border-color .15s,background .15s}
.btn:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.07)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--g-fg);color:var(--on-accent);border-color:transparent}
.btn.gym{background:var(--g-gym);color:var(--on-accent);border-color:transparent}
.btn.study{background:var(--g-study);color:var(--on-accent);border-color:transparent}
.btn.task{background:var(--g-task);color:var(--on-accent);border-color:transparent}
.btn.food{background:var(--g-food);color:var(--on-accent);border-color:transparent}
.btn.bodyb{background:var(--g-body);color:var(--on-accent);border-color:transparent}
.btn.habitb{background:var(--g-habit);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--danger)}
.btn .i{width:16px;height:16px;stroke-width:2.2}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;flex:none}
.ib:hover{background:rgba(255,255,255,.06);color:var(--fg)}
.link{background:none;border:0;padding:0;color:var(--task);font-weight:700;cursor:pointer;font-size:13.5px;text-align:left}

/* chips, tabs */
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.fchip.on{background:rgba(255,255,255,.08);color:var(--fg);border-color:var(--line-2)}
.fchips.xs .fchip{height:28px;padding:0 10px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);background:color-mix(in srgb,var(--c,var(--muted)) 16%,transparent);color:var(--c,var(--muted));white-space:nowrap}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;align-self:flex-start;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:34px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;flex:none}
.tabs button.on{color:var(--fg);background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--line)}
.tabs .tc{font-size:11px;color:var(--muted);margin-left:3px}

/* tasks + swipe */
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;--rowbg:var(--surface)}
.tlist.onbg{--rowbg:var(--bg)}
.trow{position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.trow:last-child{border-bottom:0}
.trow::before,.trow::after{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;padding:0 18px;font-weight:800;font-size:13px;opacity:0;transition:opacity .15s}
.trow::before{content:"Zrobione";color:var(--ok);background:rgba(85,219,147,.12)}
.trow::after{content:"Na jutro";justify-content:flex-end;color:var(--task);background:rgba(142,150,255,.12)}
.trow.done::before{content:"Przywróć"}
.trow[data-dir=r]::before,.trow[data-dir=l]::after{opacity:.6}
.trow.arm[data-dir=r]::before,.trow.arm[data-dir=l]::after{opacity:1}
.tin{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;background:var(--rowbg);position:relative;z-index:1;touch-action:pan-y;transition:transform .22s ease}
.trow.swiping .tin{transition:none}
.chk{flex:none;width:23px;height:23px;margin-top:1px;border-radius:8px;border:2px solid var(--faint);background:none;display:grid;place-items:center;cursor:pointer;color:var(--on-accent);padding:0;transition:background .15s,border-color .15s}
.chk .i{width:14px;height:14px;stroke-width:3.2}
.p3 .chk{border-color:var(--danger)}
.p2 .chk{border-color:var(--muted)}
.done .chk{background:var(--g-ok);border-color:transparent}
.tbody{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.ttl{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.done .ttl{text-decoration:line-through;color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.meta>span{display:inline-flex;align-items:center;gap:4px}
.meta .i{width:13px;height:13px}
.late{color:var(--danger)!important}
.qadd{display:flex;gap:8px;flex-wrap:wrap}
.qadd input{flex:1 1 220px}
.qadd select{flex:0 1 140px}
.grip{cursor:grab;touch-action:none;color:var(--faint);display:grid;place-items:center;width:24px;height:30px;border:0;background:none;padding:0;flex:none;border-radius:7px}
.grip .i{stroke-width:3.4;width:16px;height:16px}
.grip:hover{color:var(--fg)}
.dragging{background:var(--surface-3)!important;box-shadow:0 14px 32px rgba(0,0,0,.55);position:relative;z-index:5;border-radius:12px}
.dragging .tin{background:var(--surface-3)}
body.is-drag{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.flabel{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
input,select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--line-2);border-radius:12px;color:var(--fg);font:500 15px var(--body);padding:10px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--ok);padding:0}
input[type=file]{padding:8px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:rgba(142,150,255,.7);box-shadow:0 0 0 3px rgba(142,150,255,.16);outline:none}
input[type=number]{font-family:var(--mono)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.row3{grid-template-columns:repeat(2,minmax(0,1fr))}.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;height:34px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:700;font-size:13.5px;cursor:pointer;padding:0 8px}
.seg button.on{background:rgba(255,255,255,.1);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi)}
.tog{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;font-size:14px}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog .sw{width:42px;height:25px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .2s}
.tog input:checked+.sw{background:var(--g-ok)}
.tog input:checked+.sw::after{transform:translateX(17px)}
.tog input:focus-visible+.sw{outline:2px solid var(--task);outline-offset:2px}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.subs li{display:flex;align-items:center;gap:6px;background:var(--surface)}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--fg);font-family:var(--mono);font-weight:600}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:11px;border:2px solid transparent;cursor:pointer;background:var(--c)}
.swatches button.on{border-color:var(--fg)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daypick button{height:38px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.3);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer}
.daypick button.on{background:var(--habit);border-color:var(--habit);color:var(--on-accent)}

/* modal sheet */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(3,4,7,.7);z-index:40;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100vw - 32px));max-height:calc(100dvh - 64px);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 30%),var(--surface);border:1px solid var(--line-2);border-radius:24px;display:flex;flex-direction:column;box-shadow:0 40px 90px rgba(0,0,0,.65)}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 16px 4px 22px}
.sheet h2{margin:0;font:600 18px var(--display);letter-spacing:-.02em}
.sheet form{display:flex;flex-direction:column;min-height:0;flex:1}
.mscroll{overflow:auto;padding:12px 22px 18px;display:flex;flex-direction:column;gap:16px;min-height:0;-webkit-overflow-scrolling:touch}
.sheet footer{display:flex;gap:8px;align-items:center;padding:14px 22px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet footer .sp{flex:1}
@media (max-width:759px){
  .sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:93dvh;border-radius:26px 26px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0}
  .sheet>header{padding-top:8px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .mscroll,.sheet footer{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choose button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);cursor:pointer;text-align:left;font-weight:700;box-shadow:inset 0 1px 0 var(--hi)}
.choose button:hover{background:rgba(255,255,255,.06)}
.choose button .i{color:var(--c);width:22px;height:22px}
.choose small{font-weight:500;color:var(--muted);font-size:12.5px}

/* toasts */
.toasts{position:fixed;z-index:60;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:min(370px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:center;padding:10px 10px 10px 14px;border-radius:16px;background:rgba(26,30,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.55);font-size:14px;font-weight:600}
.toast.err .i{color:var(--danger)}
.toast.ok .i{color:var(--ok)}
.toast.rem{border-color:rgba(255,176,74,.6)}
.toast.rem .i{color:var(--gym)}
.toast.win{border-color:rgba(85,219,147,.6)}
.toast.win .i{color:var(--ok)}
.toast span{flex:1}
.toast .ta{background:none;border:0;color:var(--task);font-weight:800;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:13.5px}
.toast .ta:hover{background:rgba(255,255,255,.06)}

/* home */
.hello{display:flex;flex-direction:column;gap:6px}
.hello .date{font:600 clamp(28px,5.4vw,44px)/1.04 var(--display);letter-spacing:-.04em;margin:0;text-wrap:balance}
.hello .sum{color:var(--muted);font-size:14.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.hello .sum b{color:var(--fg);font-weight:700}
.quick{display:flex;flex-direction:column;gap:10px}
.qmeal{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 var(--hi)}
.qmeal .i{color:var(--food)}
.qmeal input{flex:1;background:none;border:0;padding:8px 2px;box-shadow:none}
.qmeal input:focus{box-shadow:none}
.qrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.qrow::-webkit-scrollbar{display:none}
.qa{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--fg);box-shadow:inset 0 1px 0 var(--hi)}
.qa:hover{background:rgba(255,255,255,.07)}
.qa .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--g,var(--c));color:var(--on-accent)}
.qa .dot .i{width:14px;height:14px;stroke-width:2.6}
.qa small{font:600 12px var(--mono);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;align-items:stretch}
.tile{gap:12px;min-width:0;overflow:hidden;position:relative}
.tile::after{content:"";position:absolute;top:-60px;right:-60px;width:160px;height:160px;border-radius:50%;background:var(--c);opacity:.07;filter:blur(30px);pointer-events:none}
.tile.wide{grid-column:1/-1}
.fl{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fl .i{width:15px;height:15px;color:var(--c)}
.fl .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:4px 6px;border-radius:8px;color:var(--muted);font:600 12px var(--mono);letter-spacing:0;text-transform:none;cursor:pointer}
.fl .go:hover{color:var(--fg);background:rgba(255,255,255,.05)}
.fl .go .i{color:inherit;width:14px;height:14px}
.fbig{margin:0;font:600 23px/1.15 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere}
.fbig small{font:600 13px var(--body);color:var(--muted);letter-spacing:0}
.fs{margin:0;font-size:13.5px;color:var(--muted)}
.tile .tlist .tin{padding:2px 0 0;background:transparent}
.tile .trow{border:0}
.minimac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.minimac div{display:flex;flex-direction:column;gap:5px;min-width:0}
.minimac span{font-size:11.5px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:4px}
.minimac span b{font:600 11.5px var(--mono);color:var(--fg)}
.actgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.actgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);cursor:pointer;text-align:left;min-width:0}
.actgrid button:hover{border-color:var(--line-2)}
.actgrid b{font:600 18px var(--mono);letter-spacing:-.02em;color:var(--fg)}
.actgrid b.no{color:var(--faint)}
.actgrid span{font-size:11.5px;color:var(--muted);font-weight:700}
.spark{display:block;width:100%;height:64px}
.wrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hchips{display:flex;gap:8px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 8px;border-radius:999px;border:1.5px solid var(--line-2);background:rgba(255,255,255,.02);font-weight:700;font-size:14px;cursor:pointer;color:var(--fg)}
.hchip .c2{width:23px;height:23px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:var(--on-accent)}
.hchip .c2 .i{width:13px;height:13px;stroke-width:3.2}
.hchip.on{border-color:var(--c);background:rgba(255,255,255,.06);background:color-mix(in srgb,var(--c) 14%,transparent)}
.hchip.on .c2{background:var(--c)}
.hchip small{font-size:11px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--line-2)}
.stat .v{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .l .i{width:15px;height:15px;color:var(--c)}
.bar{display:block;position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gb,var(--c,var(--fg)));transition:width .8s cubic-bezier(.2,.8,.2,1);position:relative}
.bar i::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%)}
.bar.full i{box-shadow:0 0 12px var(--c,var(--fg))}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week span{display:grid;place-items:center;height:24px;border-radius:8px;font:600 10.5px var(--mono);color:var(--faint);background:rgba(0,0,0,.3)}
.week span.has{background:var(--g-gym);color:var(--on-accent)}
.week span.plan{box-shadow:inset 0 0 0 1.5px rgba(255,176,74,.6);color:var(--gym)}
.week span.today{outline:1.5px solid var(--fg);outline-offset:1px}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.planday{display:flex;flex-direction:column;gap:12px}
.exlines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlines li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.exlines li:last-child{border-bottom:0}
.exlines li b{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}
.up{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.up li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.up li:last-child{border-bottom:0}
.up .when{flex:none;width:72px;font:600 12px var(--mono);color:var(--muted);text-transform:uppercase}
.up .when.soon{color:var(--danger)}
.up .what{flex:1;min-width:0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.up .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.welcome{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.welcome{grid-template-columns:repeat(2,minmax(0,1fr))}}
.banner{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);padding:11px 14px;border-radius:14px;border:1px dashed var(--line-2);background:rgba(255,255,255,.02)}
.banner b{color:var(--fg)}

/* workouts */
.wlist{display:flex;flex-direction:column;gap:22px}
.wgroup{display:flex;flex-direction:column;gap:10px}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.wcard{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.wcard:hover{border-color:var(--line-2)}
.wcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard .t{font:600 16px var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.wcard .s{font:500 12.5px var(--mono);color:var(--muted)}
.wcard ul{list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.wcard ul b{color:var(--fg);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.pcard{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.pcard.today{border-color:rgba(255,176,74,.5)}
.pcard .d{display:flex;justify-content:space-between;align-items:center}
.pcard .pn{font:600 17px var(--display);letter-spacing:-.02em}
.pcard.rest .pn{color:var(--faint)}
.exlist{display:flex;flex-direction:column;gap:10px}
.exc{border:1px solid var(--line-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px;background:rgba(0,0,0,.28)}
.exc.off{opacity:.6;border-style:dashed}
.exh{display:flex;gap:6px;align-items:center}
.exon{width:22px!important;height:22px!important;accent-color:var(--gym)}
.exmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exmeta select{width:auto;flex:0 1 auto;padding:6px 10px;font-size:13.5px}
.sets{display:flex;flex-direction:column;gap:6px}
.sets .set,.sets .sh{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 36px 28px;gap:7px;align-items:center}
.sets.m-reps .set,.sets.m-reps .sh,.sets.m-time .set,.sets.m-time .sh{grid-template-columns:30px minmax(0,1fr) 36px 28px}
.sh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sh span:nth-last-child(2){text-align:center}
.sn{font:600 13px var(--mono);color:var(--muted);text-align:center}
.set input{padding:8px 10px;background:var(--surface)}
.set .ib{width:28px;height:28px}
.sok{width:36px;height:36px;border-radius:10px;border:2px solid var(--line-2);background:none;cursor:pointer;display:grid;place-items:center;color:var(--on-accent);padding:0}
.sok .i{width:16px;height:16px;stroke-width:3}
.set.ok .sok{background:var(--g-ok);border-color:transparent}
.set.ok input{border-color:rgba(85,219,147,.45)}
.timer{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(255,176,74,.18),rgba(255,122,69,.1)),var(--surface);border:1px solid rgba(255,176,74,.45)}
.timer b{font:600 22px var(--mono);color:var(--gym);min-width:64px}
.timer .sp{flex:1}
.timer.end b{color:var(--ok)}
.pklist{display:flex;flex-direction:column;gap:14px}
.pkg{display:flex;flex-direction:column;gap:2px}
.pk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600;font-size:14.5px}
.pk:last-child{border-bottom:0}
.pk input{width:22px;height:22px;accent-color:var(--gym)}
.pk span{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.pk small{font:500 11.5px var(--mono);color:var(--muted)}
.pickbar{position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 6px;border-top:1px solid var(--line)}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:300px;height:auto}
.chart text{fill:var(--muted);font:500 11px var(--mono)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .guide{stroke:var(--line-2);stroke-dasharray:3 4}
.readout{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);min-height:26px}
.readout b{font:600 19px var(--mono);color:var(--fg)}
.hchart{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:170px auto;column-gap:10px;row-gap:8px}
.hy{display:flex;flex-direction:column;justify-content:space-between;font:500 11px/1 var(--mono);color:var(--muted);text-align:right;margin:-5px 0;min-width:28px}
.hplot{position:relative;border-bottom:1px solid var(--line-2)}
.hgrid{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.hgoal{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed rgba(255,255,255,.45);z-index:2;pointer-events:none}
.hgoal em{position:absolute;right:0;top:-17px;font:600 10.5px var(--mono);font-style:normal;color:var(--fg);background:var(--surface);padding:0 4px;border-radius:4px}
.hbars{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.hcol{background:none;border:0;padding:0;height:100%;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;border-radius:8px}
.hcol:hover{background:rgba(255,255,255,.03)}
.hstack{display:flex;flex-direction:column;justify-content:flex-end;width:62%;max-width:40px;height:100%}
.hstack i{display:block;width:100%;opacity:.55;transition:opacity .2s}
.hstack i:first-child{border-radius:7px 7px 0 0}
.hstack i:last-child{border-radius:0 0 3px 3px}
.hstack i:only-child{border-radius:7px 7px 3px 3px}
.hcol.on .hstack i{opacity:1}
.hx{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;font:500 11px/1.2 var(--mono);color:var(--muted);text-align:center}
.hx span{overflow:hidden;white-space:nowrap}
.hx span.on{color:var(--fg)}
@media (max-width:480px){.hx{font-size:9.5px}.hbars,.hx{gap:3px}}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
table.pr{width:100%;border-collapse:collapse;font-size:14px}
table.pr th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px 0;white-space:nowrap}
table.pr td{padding:9px 10px 9px 0;border-top:1px solid var(--line)}
table.pr td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}

/* diet */
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dhead .dd{font:600 16px var(--display);min-width:150px;text-align:center}
.dtop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:600px){.dtop{grid-template-columns:minmax(0,1fr);justify-items:center}}
.ring{position:relative;width:176px;height:176px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font:600 32px/1 var(--mono);letter-spacing:-.04em}
.ring .c span{font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}
.ring .prog{filter:drop-shadow(0 0 8px rgba(255,92,138,.35));transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.macros{display:flex;flex-direction:column;gap:14px;width:100%}
.macro{display:flex;flex-direction:column;gap:6px}
.macro .ml{display:flex;justify-content:space-between;font-size:13px;font-weight:700;gap:8px}
.macro .ml span:last-child{font-family:var(--mono);font-weight:500;color:var(--muted)}
.water{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.water button{width:30px;height:38px;border-radius:6px 6px 11px 11px;border:1.5px solid rgba(98,191,255,.5);background:none;cursor:pointer;padding:0;transition:background .2s}
.water button.f{background:linear-gradient(180deg,rgba(98,191,255,.55),rgba(126,155,255,.85))}
.meals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.meals{grid-template-columns:minmax(0,1fr)}}
.meal header h3{margin:0;font:600 14px var(--display)}
.meal header .k{font:500 13px var(--mono);color:var(--muted)}
.food{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.food .fn{flex:1;min-width:0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.food .fm{font:500 11.5px var(--mono);color:var(--muted);display:block;margin-top:2px}
.food .fk{font:600 14px var(--mono);white-space:nowrap}
.recent{display:flex;gap:6px;flex-wrap:wrap}
.recent button{border:1px solid var(--line-2);background:rgba(0,0,0,.3);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--fg)}
.recent button small{color:var(--muted);font-family:var(--mono);margin-left:4px}
.sug{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.sug:empty{display:none}
.sug button{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:rgba(0,0,0,.3);text-align:left;cursor:pointer;font-weight:600;font-size:14px;color:var(--fg)}
.sug button:last-child{border-bottom:0}
.sug button small{color:var(--muted);font:500 12px var(--mono);white-space:nowrap}
.basebox{border:1px solid var(--line-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.28)}
.basebox .bt{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.aibox{border:1px solid rgba(142,150,255,.35);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,rgba(124,134,255,.12),rgba(180,156,255,.04))}
.aibox .ah{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.aibox .ah .i{color:var(--task)}
.airow{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.airow .an{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.airow .an small{display:block;font:500 11.5px var(--mono);color:var(--muted)}
.airow .ak{font:600 14px var(--mono)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* study */
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.exam{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.exam .cd{font:600 22px var(--mono);letter-spacing:-.03em}
.exam .cd.soon{color:var(--danger)}
.exam .et{font-weight:700;overflow-wrap:anywhere}
.exam .es{font-size:12.5px;color:var(--muted)}
.subjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.subj{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.subj.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.subj .sn2{display:flex;align-items:center;gap:9px;font:600 16px var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.subj .sn2 i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.subj .sm{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.topics{display:flex;flex-direction:column}
.topic{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.topic:last-child{border-bottom:0}
.topic .tt{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.st{border:0;cursor:pointer;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.07);background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c);flex:none}
.cards{display:flex;flex-direction:column}
.cardrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cardrow:last-child{border-bottom:0}
.cardrow button.cf{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;overflow-wrap:anywhere;color:var(--fg)}
.boxes{display:flex;gap:2px;flex:none}
.boxes i{width:5px;height:12px;border-radius:2px;background:var(--line-2)}
.boxes i.on{background:var(--c,var(--study))}
.fc{min-height:220px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01)),rgba(0,0,0,.3);border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;cursor:pointer;width:100%;color:var(--fg)}
.fc .q{font:600 20px/1.3 var(--display);overflow-wrap:anywhere;letter-spacing:-.02em}
.fc .a{font-size:16px;line-height:1.55;border-top:1px dashed var(--line-2);padding-top:14px;width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.fc .tap{font-size:12.5px;color:var(--muted)}
.fcbtn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fcbtn .btn{height:50px;flex-direction:column;gap:0;line-height:1.1}
.fcbtn .btn small{font:500 11px var(--mono);opacity:.75}
.fcprog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:980px){.cal{grid-template-columns:minmax(0,1fr)}}
.chead{display:flex;align-items:center;gap:8px 12px;justify-content:space-between;flex-wrap:wrap}
.chead h2{margin:0;font:600 22px var(--display);letter-spacing:-.03em}
.chead .seg{flex:none}
.chead .seg button{padding:0 14px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cdow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);text-align:center;padding:4px 0 6px;text-transform:uppercase}
.cday{min-height:96px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;overflow:hidden}
.cday:hover{border-color:var(--line-2)}
.cday.out{opacity:.38}
.cday.sel{border-color:var(--fg)}
.cday .dn{font:600 12.5px var(--mono);color:var(--muted)}
.cday.today .dn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--g-fg);color:var(--on-accent)}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.07);background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.ev.dn2{text-decoration:line-through;opacity:.6}
.ev.pl{background:none;box-shadow:inset 0 0 0 1px var(--line-2)}
.more{font-size:10.5px;color:var(--muted);font-weight:700;padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
@media (max-width:640px){.cday{min-height:54px;padding:5px;align-items:center}.evs,.more{display:none}.dots{display:flex;justify-content:center}}
.agenda{display:flex;flex-direction:column;gap:6px}
.agenda .it{display:flex;gap:10px;align-items:center;padding:10px 11px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);text-align:left;cursor:pointer;width:100%;color:var(--fg)}
.agenda .it .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.agenda .it .w{flex:1;min-width:0;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.agenda .it small{color:var(--muted);font-size:12px;display:block;font-weight:500}
.wk{display:flex;flex-direction:column;gap:10px}
.wkday{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.wkday.today{border-color:rgba(255,255,255,.4)}
.wkday.past{opacity:.7}
.wkh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wkh b{font:600 15px var(--display);letter-spacing:-.02em}
.wkh b span{color:var(--muted);font:500 12.5px var(--mono);margin-left:8px}
.wkday .none{font-size:13px;color:var(--faint)}

/* wizard */
.wz{display:flex;flex-direction:column;gap:16px}
.wzprog{display:flex;gap:4px}
.wzprog i{flex:1;height:4px;border-radius:2px;background:var(--line-2);transition:background .2s}
.wzprog i.on{background:var(--c)}
.wzq{font:600 21px/1.25 var(--display);letter-spacing:-.025em;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line-2);background:rgba(0,0,0,.28);text-align:left;cursor:pointer;font-weight:700;font-size:15px;color:var(--fg)}
.opt:hover{border-color:rgba(255,255,255,.25)}
.opt small{font-weight:500;color:var(--muted);font-size:13px}
.opt.on{border-color:var(--c);background:rgba(255,255,255,.06);background:color-mix(in srgb,var(--c) 12%,transparent)}
.wznav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.wplan{display:flex;flex-direction:column;gap:8px}
.wpd{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.wpd.rest{opacity:.55}
.wph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wph b{width:96px;font-size:12.5px;color:var(--muted);font-weight:700}
.wph span:not(.chip){flex:1;min-width:0;font-weight:700}
.wpd .exlines{margin-top:4px}
.wpd .exlines li{font-size:13px;padding:5px 0}
.mplan{display:flex;flex-direction:column;gap:8px}
.mp{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.mph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mph b{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}

/* habits */
.hlist{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:10px 12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.hrow:last-child{border-bottom:0}
.hname{flex:1 1 180px;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:var(--fg)}
.hname b{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.hname b i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.hname small{font-size:12.5px;color:var(--muted)}
.hname small b{display:inline;font:600 12.5px var(--mono);color:var(--fg)}
.hdays{display:flex;gap:5px}
.hd{width:34px;height:40px;border-radius:10px;border:1.5px solid var(--line-2);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 10px/1.1 var(--mono);color:var(--faint);padding:0;gap:1px}
.hd b{font-size:12px;color:var(--muted)}
.hd.on{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.hd.on b{color:var(--on-accent)}
.hd.auto{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.hd.off{opacity:.35;border-style:dashed}
.hd.today{outline:1.5px solid var(--fg);outline-offset:1px}
@media (max-width:520px){.hdays{width:100%;justify-content:space-between}.hd{flex:1}}

/* body */
.bodytop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.bigw{font:600 34px/1 var(--mono);letter-spacing:-.04em}
.bigw small{font-size:15px;color:var(--muted);letter-spacing:0}
.delta{font:600 13px var(--mono)}
.delta.good{color:var(--ok)}
.delta.bad{color:var(--danger)}
.delta.flat{color:var(--muted)}

/* friends, settings */
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.people:empty{display:none}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .av{width:40px;height:40px}
.person .pi{flex:1;min-width:0}
.person .pn3{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.person .ps{font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:3px}
.person .ps b{font-family:var(--mono);color:var(--fg);font-weight:600}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.feed li{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px}
.feed .av{width:32px;height:32px}
.feed .fx{flex:1;min-width:0;font-size:14px}
.feed .fx b{font-weight:700}
.feed .fx .s{font:500 12px var(--mono);color:var(--muted);margin-top:3px}
.note{font-size:13px;color:var(--muted);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.55}
.note b{color:var(--fg)}
.note.warn{border-color:rgba(255,176,74,.4)}
.note ol,.note ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.loading{color:var(--muted);font-size:14px;padding:30px 0}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:900px){.setgrid{grid-template-columns:minmax(0,1fr)}}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv div b{font:600 14px var(--mono)}
.mods{display:flex;flex-direction:column;gap:12px}
.mods .tog small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 32px;gap:8px;align-items:center}

/* motion */
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}}
  @media (max-width:759px){.sheet{animation:up .26s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.3}}}

  .enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(n+5){animation-delay:.16s}

  .enter .hstack i{animation:barup .8s cubic-bezier(.2,.8,.2,1) .1s both}

  .bar.full i{animation:glow 1.4s ease-in-out 3}
  @keyframes glow{50%{filter:brightness(1.4);box-shadow:0 0 18px var(--c,var(--fg))}}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

async function afterLogin(u){

/* ---------- Gemini (AI) ---------- */
const DEF_MODELS=['gemini-flash-latest','gemini-flash-lite-latest','gemini-2.5-flash','gemini-2.5-flash-lite'];
function models(tier){const custom=(LS.get('forma.gmodel')||'').split(',').map(s=>s.trim()).filter(Boolean);let m=[...custom,...DEF_MODELS.filter(x=>!custom.includes(x))];if(tier==='quick')m=[...m.filter(x=>/lite/.test(x)),...m.filter(x=>!/lite/.test(x))];return m}
function parseJSON(t){t=String(t||'').trim();try{return JSON.parse(t)}catch(e){}const f=/```(?:json)?\s*([\s\S]*?)```/.exec(t);if(f){try{return JSON.parse(f[1])}catch(e){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}throw{code:'invalid_json',message:'no JSON',text:t}}
async function gemini(input,opts={},json=false){
  const key=LS.get('forma.gemini');if(!key)throw{code:'not_granted',message:'Brak klucza Gemini'};
  const text=typeof input==='string'?input:input.map(m=>(m.role==='assistant'?'Asystent: ':'')+m.content).join('\n\n');
  let last={code:'upstream_error',message:'Brak odpowiedzi'};
  for(const m of models(opts.modelTier)){
    let r;
    try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',signal:opts.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{role:'user',parts:[{text}]}],generationConfig:{temperature:json?.5:.7,...(json?{responseMimeType:'application/json'}:{})}})})}
    catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled',message:'Przerwano'};last={code:'upstream_error',message:'Brak połączenia z Gemini'};continue}
    let body=null;try{body=await r.json()}catch(e){}
    if(r.ok){const out=(body?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(!out){last={code:'empty_completion',message:'Pusta odpowiedź'};continue}
      try{opts.onText&&opts.onText({text:out,delta:out})}catch(e){}return{text:out,truncated:body?.candidates?.[0]?.finishReason==='MAX_TOKENS',modelTierApplied:'default'}}
    const msg=body?.error?.message||'';
    if(r.status===404||(r.status===400&&/model/i.test(msg)&&!/API key/i.test(msg))){last={code:'upstream_error',message:msg};continue}
    if(r.status===429||r.status===503){last={code:'rate_limited',message:msg};continue}
    if(/API key|API_KEY/i.test(msg)||r.status===401||r.status===403){window.FORMA_PWA.keyError=true;throw{code:'upstream_error',message:'Nieprawidłowy klucz Gemini. Sprawdź go w Ustawieniach.'}}
    last={code:'upstream_error',message:msg||('HTTP '+r.status)};
  }
  throw last;
}

/* ---------- persistence ---------- */
const chains={};
function put(item){item.updated=Date.now();S.items.set(item.id,item);render();write(item.id,item)}
function putMany(list){for(const it of list){it.updated=Date.now();S.items.set(it.id,it)}render();for(const it of list)write(it.id,it)}
function del(id){if(!S.items.has(id))return;S.items.delete(id);render();write(id,null)}
function delMany(ids){ids=ids.filter(id=>S.items.has(id));ids.forEach(id=>S.items.delete(id));render();ids.forEach(id=>write(id,null))}
function snap(ids){const b=ids.map(id=>[id,S.items.has(id)?clone(S.items.get(id)):null]);return()=>{const back=b.filter(x=>x[1]).map(x=>x[1]),gone=b.filter(x=>!x[1]).map(x=>x[0]);if(back.length)putMany(back);if(gone.length)delMany(gone)}}
function undoable(msg,ids,fn,kind='ok'){const r=snap(ids);fn();toast(msg,kind,6500,{label:'Cofnij',fn:r})}
function write(id,item){
  if(S.mode==='db'){
    const body=item?clone(item):null;if(body)delete body.id;
    chains[id]=(chains[id]||Promise.resolve()).then(()=>body?S.col.doc(id).set(body):S.col.doc(id).delete())
      .catch(e=>toast(e&&e.code==='quota_exceeded'?'Baza jest pełna. Usuń stare wpisy, żeby zapisać nowe.':'Nie udało się zapisać zmiany. Sprawdź połączenie i spróbuj jeszcze raz.','err'));
  }else saveLocal();
  if(!item||item.kind==='workout'||id==='settings')schedulePublic();
}
function loadLocal(){try{const a=JSON.parse(ls.get('forma.items')||'[]');S.items=new Map(a.map(x=>[x.id,x]))}catch(e){}}
function saveLocal(){ls.set('forma.items',JSON.stringify([...S.items.values()]))}

async function syncPublic(){

/* ---------- workout math ---------- */
const MODES=[['kg','Ciężar × powtórzenia'],['reps','Same powtórzenia'],['time','Czas']];
const exMode=e=>e&&e.mode||'kg';
const fmtSec=s=>{s=Math.round(+s||0);return s>=60?`${Math.floor(s/60)}:${pad(s%60)} min`:`${s} s`};
const setVal=(e,s)=>{const m=exMode(e);return m==='kg'?(+s.kg||0):m==='reps'?(+s.reps||0):(+s.sec||0)};
const setStr=(e,s)=>{const m=exMode(e);return m==='kg'?(+s.kg?`${fmtN(s.kg)}×${+s.reps||0}`:`${+s.reps||0} powt.`):m==='reps'?`${+s.reps||0} powt.`:fmtSec(s.sec)};
const fmtVal=(m,v)=>m==='kg'?`${fmtN(v)} kg`:m==='reps'?`${fmtN(v)} powt.`:fmtSec(v);
function wSum(w){
  if(w.type==='cardio'){const p=w.km&&w.min?paceStr(w.min/w.km):'';return[w.km?fmtN(w.km)+' km':'',w.min?w.min+' min':'',p?p+' /km':'',w.hr?w.hr+' bpm':''].filter(Boolean).join(' · ')||w.act||'Cardio'}
  const ex=w.ex||[],sets=ex.reduce((a,e)=>a+e.sets.length,0),vol=ex.reduce((a,e)=>a+(exMode(e)==='kg'?e.sets.reduce((b,s)=>b+(+s.kg||0)*(+s.reps||0),0):0),0);
  return `${ex.length} ćw. · ${sets} serii${vol?` · ${fmtN(Math.round(vol))} kg`:''}`;
}
const bestVal=e=>Math.max(0,...e.sets.map(s=>setVal(e,s)));
const bestSet=e=>e.sets.reduce((b,s)=>{const v=setVal(e,s),bv=b?setVal(e,b):-1;return v>bv||(v===bv&&(+s.reps||0)>(+b.reps||0))?s:b},null);
function exPreview(e){const m=exMode(e);if(m==='kg'){const b=bestSet(e)||{},reps=e.sets.map(s=>s.reps).filter(Boolean);return `${e.sets.length}×${reps.length?reps[0]:'–'}${+b.kg?` · ${fmtN(b.kg)} kg`:''}`}return `${e.sets.length} serie · maks. ${fmtVal(m,bestVal(e))}`}
function lastEx(name,skipId){if(!name)return null;for(const w of workouts()){if(w.id===skipId||w.type!=='gym')continue;const e=(w.ex||[]).find(e=>norm(e.name)===norm(name));if(e&&e.sets.length)return{e,date:w.date}}return null}
function bestEver(name,mode,skipId){let m=0;for(const w of workouts()){if(w.id===skipId)continue;for(const e of w.ex||[])if(norm(e.name)===norm(name)&&exMode(e)===mode)m=Math.max(m,bestVal(e))}return m}
function exNames(){const m=new Map();for(const w of workouts())for(const e of w.ex||[])if(e.name&&!m.has(norm(e.name)))m.set(norm(e.name),e.name.trim());return[...m.values()]}
function exSessions(name){const out=[];for(const x of workouts().slice().reverse()){if(x.type!=='gym')continue;const e=(x.ex||[]).find(e=>norm(e.name)===norm(name));if(e&&e.sets.length){const v=bestVal(e);if(v)out.push({d:x.date,y:v,mode:exMode(e),e})}}return out}
function weeksStreak(weeks){const set=new Set(weeks);let w=weekStart(today());if(!set.has(w))w=addD(w,-7);let n=0;while(set.has(w)){n++;w=addD(w,-7)}return n}
function nextDue(t){const b=t.due||today();const step=s=>{if(t.repeat==='daily')return addD(s,1);if(t.repeat==='weekly')return addD(s,7);const d=pd(s);d.setMonth(d.getMonth()+1);return ds(d)};let n=step(b);while(n<=today())n=step(n);return n}

/* habits math */
const hSched=(h,d)=>!h.days||h.days.length===0||h.days.includes(dow(d));
const hAuto=(h,d)=>!!(h&&h.link&&+h.thr>0&&+((S.items.get('a_'+d)||{})[h.link]||0)>=+h.thr);
const hDone=(h,d)=>!!(h.log&&h.log[d])||hAuto(h,d);
function hStreak(h){let d=today();if(!hDone(h,d))d=addD(d,-1);let n=0,guard=0;while(guard++<400){if(hSched(h,d)){if(hDone(h,d))n++;else break}d=addD(d,-1)}return n}
function hRate(h,days=30){let s=0,dn=0;for(let i=0;i<days;i++){const d=addD(today(),-i);if(h.created&&ds(new Date(h.created))>d)break;if(hSched(h,d)){s++;if(hDone(h,d))dn++}}return s?Math.round(dn/s*100):0}
const todaysHabits=()=>habits().filter(h=>hSched(h,today()));

   </section>`;

    ${rem.length?`<ul class="up">${rem.map(r=>`<li><span class="when ${toMin(r.time)>=nm?'soon':''}">${r.time}</span><span class="what" style="${toMin(r.time)<nm?'color:var(--faint)':''}">${esc(r.label)}</span></li>`).join('')}</ul>`:`<p class="muted" style="margin:0">Włącz przypomnienie w zadaniu, wydarzeniu albo w planie treningów. Pojawi się tutaj i jako powiadomienie, gdy aplikacja jest otwarta.</p>`}
    <p class="hint" style="margin:0">Włącz powiadomienia w Ustawieniach, żeby przypomnienia wyskakiwały na telefonie.</p></div>`;
  return `<section class="hello"><div class="eyebrow">${greet}${first?', '+esc(first):''}</div><h1 class="date">${cap(fmtLong(t))}</h1>${sum?`<div class="sum">${sum}</div>`:''}</section>

VIEWS.zadania=()=>{
  const t=today(),F=[['aktywne','Aktywne'],['dzis','Dziś'],['nadchodzace','Nadchodzące'],['zalegle','Zaległe'],['zrobione','Zrobione']];
  let l=tasks();if(S.taskCat)l=l.filter(x=>x.cat===S.taskCat);
  const by={aktywne:x=>!x.done,dzis:x=>x.due===t,nadchodzace:x=>!x.done&&x.due>t,zalegle:x=>!x.done&&x.due&&x.due<t,zrobione:x=>x.done};
  const own=S.taskSort==='moja'&&S.taskF!=='zrobione';
  l=l.filter(by[S.taskF]).sort(S.taskF==='zrobione'?(a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''):own?byOrder:taskSortFn);
  S.lists.tasks=l.map(x=>x.id);
  const lateN=tasks().filter(by.zalegle).length;
  return `<div class="vh"><div><h1>Zadania</h1><div class="sub">${tasks().filter(x=>!x.done).length} do zrobienia${lateN?` · <span class="late">${lateN} zaległe</span>`:''}</div></div><button class="btn task" data-act="newTask">${icon('plus')}Nowe zadanie</button></div>
  <form id="qadd" class="qadd"><input id="qadd-in" placeholder="Szybko dodaj zadanie i naciśnij Enter" maxlength="140" value="${esc(S.qText)}" autocomplete="off" aria-label="Nazwa zadania">
   <select id="qadd-due" aria-label="Termin"><option value="">Bez terminu</option><option value="t" ${S.qDue==='t'?'selected':''}>Dziś</option><option value="j" ${S.qDue==='j'?'selected':''}>Jutro</option></select>
   <button class="btn primary" type="submit">Dodaj</button></form>
  <div style="display:flex;flex-direction:column;gap:10px">
   <div class="fchips">${F.map(([v,lb])=>`<button class="fchip ${S.taskF===v?'on':''}" data-act="taskF" data-v="${v}">${lb}</button>`).join('')}</div>
   <div class="fchips"><button class="fchip ${!S.taskCat?'on':''}" data-act="taskCat" data-v="">Wszystkie kategorie</button>${CATS.map(c=>`<button class="fchip ${S.taskCat===c[0]?'on':''}" data-act="taskCat" data-v="${c[0]}" style="${S.taskCat===c[0]?`color:${c[2]}`:''}">${c[1]}</button>`).join('')}</div>
   ${S.taskF!=='zrobione'?`<div class="actions"><span class="hint">Kolejność:</span><div class="fchips xs"><button class="fchip ${!own?'on':''}" data-act="taskSort" data-v="termin">Według terminu</button><button class="fchip ${own?'on':''}" data-act="taskSort" data-v="moja">Moja (przeciągnij)</button></div></div>`:''}
  </div>
  ${l.length?`<ul class="tlist onbg" data-rl="tasks">${l.map((x,i)=>taskRow(x,i,own)).join('')}</ul>${coarse()?`<p class="hint" style="margin:0">Przesuń zadanie w prawo, by je odhaczyć, albo w lewo, by przenieść na jutro.</p>`:''}`
  :`<div class="empty">${emptyArt('var(--task)')}<strong>Tu jest pusto</strong>Dodaj zadanie powyżej albo zmień filtr. Zadania z terminem pojawią się też w kalendarzu.</div>`}`;
};

VIEWS.treningi=()=>{
  const T=[['dziennik','Dziennik'],['plan','Plan tygodnia'],['postepy','Postępy']];
  if(!T.some(t=>t[0]===S.wTab))S.wTab='dziennik';
  const body={dziennik:vLog,plan:vPlan,postepy:vProg}[S.wTab];
  return `<div class="vh"><div><h1>Treningi</h1><div class="sub">Siłownia, cardio, plan i postępy</div></div><div class="actions"><button class="btn" data-act="wizTrain">${icon('ai')}Plan z pytań</button><button class="btn gym" data-act="newWorkout">${icon('plus')}Zapisz trening</button></div></div>
  <div class="tabs" role="tablist" style="--hue:var(--gym)">${T.map(([v,l])=>`<button role="tab" aria-selected="${S.wTab===v}" class="${S.wTab===v?'on':''}" data-act="wTab" data-v="${v}">${l}</button>`).join('')}</div>${body()}`;
};
function vLog(){
  const w=workouts();
  if(!w.length)return `<div class="empty">${emptyArt('var(--gym)')}<strong>Brak zapisanych treningów</strong>Zapisz pierwszy trening siłowy albo cardio. Ciężary i serie posłużą do wykresów postępów.<div class="actions"><button class="btn gym" data-act="newWorkout">${icon('plus')}Zapisz trening</button></div></div>`;
  const ws0=weekStart(today()),groups=new Map();
  for(const x of w){const k=weekStart(x.date);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}
  const label=k=>k===ws0?'Ten tydzień':k===addD(ws0,-7)?'Poprzedni tydzień':`${pd(k).getDate()} ${MON3[pd(k).getMonth()]} – ${pd(addD(k,6)).getDate()} ${MON3[pd(addD(k,6)).getMonth()]}`;
  return `<div class="wlist">${[...groups].slice(0,12).map(([k,l])=>`<div class="wgroup"><div class="eyebrow">${label(k)} · ${l.length}</div><div class="wcards">${l.map(wCard).join('')}</div></div>`).join('')}</div>`;
}
function wCard(w){
  const c=w.type==='cardio';
  return `<button class="wcard" data-act="editWorkout" data-id="${w.id}"><div class="top"><span class="chip" style="--c:${c?'var(--s5)':'var(--gym)'}">${c?esc(w.act||'Cardio'):'Siłownia'}</span><span class="s">${fmtDate(w.date)}</span></div>
   <div class="t">${esc(w.title||(c?w.act:'Trening'))}</div><div class="s">${esc(wSum(w))}</div>
   ${!c&&w.ex?.length?`<ul>${w.ex.slice(0,4).map(e=>`<li><b>${esc(e.name)}</b> ${exPreview(e)}</li>`).join('')}${w.ex.length>4?`<li>+${w.ex.length-4} więcej</li>`:''}</ul>`:''}</button>`;
}
function vPlan(){
  const p=plan(),td=dow(today());
  if(!p)return `<div class="empty">${emptyArt('var(--gym)')}<strong>Ułóż plan tygodnia</strong>Odpowiedz na kilka pytań, a plan ułoży się pod Twój cel, czas i sprzęt. Pojawi się na ekranie „Dziś” i w kalendarzu, a zapis treningu wypełni się ćwiczeniami z planu.<div class="actions"><button class="btn gym" data-act="wizTrain">${icon('ai')}Stwórz plan z pytań</button><button class="btn" data-act="seedPlan">Wstaw przykładowy plan</button><button class="btn" data-act="editPlanDay" data-i="0">Zacznij od pustego</button></div></div>`;
  return `<div class="actions" style="justify-content:space-between"><label class="tog"><input type="checkbox" id="plan-remind" data-act2="planRemind" ${p.remind?'checked':''}><span class="sw"></span>Przypominaj o treningu o zaplanowanej godzinie</label><button class="btn sm" data-act="wizTrain">${icon('ai')}Ułóż nowy plan z pytań</button></div>
  <div class="pgrid">${DAYS.map((n,i)=>{const d=p.days[i]||{},rest=!d.name;return `<div class="pcard ${i===td?'today':''} ${rest?'rest':''}">
    <div class="d"><span class="eyebrow">${n}${i===td?' · dziś':''}</span><button class="ib" data-act="editPlanDay" data-i="${i}" aria-label="Edytuj ${n}">${icon('edit')}</button></div>
    <div class="pn">${rest?'Odpoczynek':esc(d.name)}</div>
    ${!rest?`<div class="meta">${d.type==='cardio'?`<span class="chip" style="--c:var(--s5)">Cardio</span>`:`<span class="chip" style="--c:var(--gym)">Siłownia</span>`}${d.time?`<span>${icon('clock')}${d.time}</span>`:''}</div>`:''}
    ${(d.ex||[]).length?`<ul class="exlines">${d.ex.map(e=>`<li><span>${esc(e.name)}</span><b>${esc(e.target||'')}</b></li>`).join('')}</ul>`:''}
    <div class="actions">${!rest?`<button class="btn sm gym" data-act="fromPlan" data-i="${i}">Zapisz</button>`:''}<button class="btn sm ghost" data-act="editPlanDay" data-i="${i}">Edytuj</button></div></div>`}).join('')}</div>`;
}
function vProg(){
  const w=workouts();
  if(!w.length)return `<div class="empty">${emptyArt('var(--gym)')}<strong>Wykresy pojawią się po pierwszych treningach</strong>Zapisuj ciężary, powtórzenia albo czas w seriach, a zobaczysz tu rekordy i postęp w każdym ćwiczeniu.</div>`;
  const ws0=weekStart(today()),weeks=[...Array(8)].map((_,i)=>addD(ws0,(i-7)*7));
  const wb=weeks.map(k=>{const l=w.filter(x=>weekStart(x.date)===k),a=l.filter(x=>x.type==='gym').length,b=l.filter(x=>x.type==='cardio').length;return{l:shortD(k),a,b,big:`${a+b} ${a+b===1?'trening':'treningi'}`,tip:`tydzień od ${shortD(k)} · siłownia ${a}, cardio ${b}`}});
  const names=exNames();if(!S.progEx||!names.some(n=>norm(n)===norm(S.progEx)))S.progEx=names[0]||'';
  const rows=names.map(n=>{const ss=exSessions(n);if(!ss.length)return null;const m=ss[ss.length-1].mode,sm=ss.filter(s=>s.mode===m);let best=sm[0];for(const s of sm)if(s.y>=best.y)best=s;
    let orm=0;if(m==='kg')for(const s of sm)for(const st of s.e.sets){const o=(+st.kg||0)*(1+(+st.reps||1)/30);if(o>orm)orm=o}
    const f=sm[0],l=sm[sm.length-1];return{n,m,best,f,l,cnt:sm.length,pct:f.y?(l.y-f.y)/f.y*100:0,orm}}).filter(Boolean);
  const cur=rows.find(r=>norm(r.n)===norm(S.progEx)),mode=cur?cur.m:'kg',pts=cur?inRange('ex',exSessions(cur.n).filter(s=>s.mode===mode).map(s=>({d:s.d,y:s.y}))):[];
  const ttl={kg:'Najlepszy ciężar',reps:'Najwięcej powtórzeń w serii',time:'Najdłuższy czas w serii'}[mode];
  const prog=rows.filter(r=>r.cnt>1).sort((a,b)=>b.pct-a.pct);
  const m0=today().slice(0,8)+'01',cm=w.filter(x=>x.type==='cardio'&&x.date>=m0),km=cm.reduce((a,x)=>a+(+x.km||0),0);
  const runs=w.filter(x=>x.type==='cardio'&&x.act==='Bieg'&&+x.km>=1&&+x.min),bp=runs.length?Math.min(...runs.map(x=>x.min/x.km)):0;
  return `<section class="panel"><header><h2 class="sec">Treningi w tygodniu</h2><div class="legend"><span style="--c:var(--gym)"><i></i>Siłownia</span><span style="--c:var(--s5)"><i></i>Cardio</span></div></header>${barChart(wb,'var(--gym)','var(--s5)',0,'wk')}</section>
  <div class="two">
   <section class="panel"><header><h2 class="sec">${ttl}</h2>${rangeSeg('ex')}</header>
    ${rows.length?`<select id="prog-ex" aria-label="Ćwiczenie">${rows.map(r=>`<option ${norm(r.n)===norm(S.progEx)?'selected':''}>${esc(r.n)}</option>`).join('')}</select>
    ${pts.length>1?lineChart(pts,'var(--gym)',mode==='kg'?'kg':mode==='reps'?'powt.':'s','ex'):`<p class="muted" style="margin:0">Potrzeba co najmniej dwóch treningów z tym ćwiczeniem w wybranym zakresie, żeby narysować wykres.</p>`}`:`<p class="muted" style="margin:0">Brak zapisanych serii.</p>`}</section>
   <section class="panel"><header><h2 class="sec">Cardio w tym miesiącu</h2></header>
    <div class="kpis"><div class="kpi"><b>${fmtN(km)}</b><span>km</span></div><div class="kpi"><b>${cm.length}</b><span>treningów</span></div><div class="kpi"><b>${bp?paceStr(bp):'–'}</b><span>najlepsze tempo biegu /km</span></div></div></section>
  </div>
  ${prog.length?`<section class="panel"><header><h2 class="sec">Twój postęp</h2><span class="hint">najlepsza seria: pierwszy trening → ostatni</span></header><div class="tscroll"><table class="pr"><thead><tr><th>Ćwiczenie</th><th>Na początku</th><th>Ostatnio</th><th>Zmiana</th><th>Treningi</th></tr></thead><tbody>${prog.map(r=>{const d=r.l.y-r.f.y;return `<tr><td><button class="link" style="color:var(--fg)" data-act="progPick" data-n="${esc(r.n)}">${esc(r.n)}</button></td><td class="n">${fmtVal(r.m,r.f.y)}</td><td class="n">${fmtVal(r.m,r.l.y)}</td><td class="n"><span class="delta ${d>0?'good':d<0?'bad':'flat'}">${d>0?'+':''}${r.m==='time'?(d<0?'-':'')+fmtSec(Math.abs(d)):fmtN(d)+(r.m==='kg'?' kg':'')} (${d>0?'+':''}${fmtN(Math.round(r.pct))}%)</span></td><td class="n">${r.cnt}</td></tr>`}).join('')}</tbody></table></div></section>`:''}
  ${rows.length?`<section class="panel"><header><h2 class="sec">${icon('trophy')}Rekordy</h2><span class="hint">1RM szacowane wzorem Epleya</span></header><div class="tscroll"><table class="pr"><thead><tr><th>Ćwiczenie</th><th>Najlepsza seria</th><th>Szac. 1RM</th><th>Data</th></tr></thead><tbody>${rows.slice().sort((a,b)=>(b.orm-a.orm)||a.n.localeCompare(b.n,'pl')).map(r=>{const bs=bestSet(r.best.e);return `<tr><td>${esc(r.n)}</td><td class="n">${r.m==='kg'?`${fmtN(bs.kg)} kg × ${+bs.reps||0}`:fmtVal(r.m,r.best.y)}</td><td class="n">${r.orm?fmtN(Math.round(r.orm*2)/2)+' kg':'–'}</td><td class="n">${fmtDate(r.best.d)}</td></tr>`}).join('')}</tbody></table></div></section>`:''}`;
}

  </div></section>

function eventsIndex(from,to){
  const m=new Map(),add=(d,e)=>{if(d<from||d>to)return;if(!m.has(d))m.set(d,[]);m.get(d).push(e)},t=today();
  for(const x of tasks())if(x.due)add(x.due,{c:catOf(x.cat)[2],t:x.title,done:x.done,act:'editTask',id:x.id,sub:`Zadanie${x.time?' · '+x.time:''}`,o:x.time||'99'});
  for(const v of events()){const pl=placeOf(v.place),lv=leaveAt(v.start,v.travel);add(v.date,{c:`var(--s${v.color||2})`,t:v.title,act:'editEvent',id:v.id,sub:[v.start?v.start+(v.end?'–'+v.end:''):'',pl?pl.name:'',lv?`wyjdź ${lv}`:''].filter(Boolean).join(' · ')||'Wydarzenie',o:v.start||'05'})}
  const wd=new Set();for(const w of workouts()){wd.add(w.date);add(w.date,{c:w.type==='cardio'?'var(--s5)':'var(--gym)',t:w.title||w.act||'Trening',act:'editWorkout',id:w.id,sub:wSum(w),o:'50'})}
  if(modOn('studia'))for(const e of exams()){const sj=subj(e.subject),pl=placeOf(e.place),lv=pl&&e.time?leaveAt(e.time,pl.min):'';add(e.date,{c:`var(--s${sj?.color||1})`,t:`${e.type}: ${e.title}`,act:'editExam',id:e.id,sub:[sj?sj.name:'Studia',e.time,lv?`wyjdź ${lv}`:''].filter(Boolean).join(' · '),o:e.time||'00'})}
  const p=plan();if(p)for(let d=from<t?t:from;d<=to;d=addD(d,1)){const day=p.days[dow(d)];if(day?.name&&!wd.has(d)){const pl=placeOf(day.place),lv=pl&&day.time?leaveAt(day.time,pl.min):'';add(d,{c:day.type==='cardio'?'var(--s5)':'var(--gym)',t:day.name,pl:true,act:'fromPlan',i:dow(d),date:d,sub:['Plan',day.time,lv?`wyjdź ${lv}`:''].filter(Boolean).join(' · '),o:day.time||'60'})}}
  for(const l of m.values())l.sort((a,b)=>a.o.localeCompare(b.o));return m;
}
const agendaHTML=list=>`<div class="agenda">${list.map(e=>`<button class="it" data-act="${e.act}" data-id="${e.id||''}" data-i="${e.i??''}" data-date="${e.date||''}"><span class="dot" style="--c:${e.c}"></span><span class="w" style="${e.done?'text-decoration:line-through;color:var(--faint)':''}">${esc(e.t)}<small>${esc(e.sub)}${e.pl?' · kliknij, by zapisać':''}</small></span></button>`).join('')}</div>`;
VIEWS.kalendarz=()=>{
  const t=today(),modeSeg=`<div class="seg" role="group" aria-label="Widok"><button class="${S.calMode==='week'?'on':''}" data-act="calMode" data-v="week">Tydzień</button><button class="${S.calMode==='month'?'on':''}" data-act="calMode" data-v="month">Miesiąc</button></div>`;

  const head=`<div class="vh"><div><h1>Kalendarz</h1><div class="sub">Zadania, treningi, plan i egzaminy w jednym miejscu</div></div></div>`;

    <div class="wk">${[...Array(7)].map((_,i)=>{const d=addD(ws,i),ev=idx.get(d)||[];return `<div class="wkday ${d===t?'today':''} ${d<t?'past':''}"><div class="wkh"><b>${DAYS[i]}<span>${pd(d).getDate()} ${MON3[pd(d).getMonth()]}${d===t?' · dziś':''}</span></b><button class="ib" data-act="dayAdd" data-d="${d}" aria-label="Dodaj na ${fmtLong(d)}">${icon('plus')}</button></div>${ev.length?agendaHTML(ev):'<span class="none">Wolne</span>'}</div>`}).join('')}</div>${legend}`;
  }
  const[y,mo]=S.calMonth.split('-').map(Number),first=`${S.calMonth}-01`,lead=dow(first),days=new Date(y,mo,0).getDate(),n=Math.ceil((lead+days)/7)*7,start=addD(first,-lead),end=addD(start,n-1);

   <div class="chead"><h2 style="text-transform:capitalize">${MON[mo-1]} ${y}</h2><div class="actions">${modeSeg}<button class="ib" data-act="calNav" data-n="-1" aria-label="Poprzedni miesiąc">${icon('chevL')}</button><button class="btn sm" data-act="calNav" data-n="0">Dziś</button><button class="ib" data-act="calNav" data-n="1" aria-label="Następny miesiąc">${icon('chevR')}</button></div></div>
   <div class="cgrid">${DS.map(d=>`<div class="cdow">${d}</div>`).join('')}
    ${[...Array(n)].map((_,i)=>{const d=addD(start,i),ev=idx.get(d)||[];return `<button class="cday ${d.slice(0,7)!==S.calMonth?'out':''} ${d===t?'today':''} ${d===S.calDay?'sel':''}" data-act="calDay" data-d="${d}" aria-label="${fmtLong(d)}, ${ev.length} wpisów"><span class="dn">${+d.slice(8)}</span>
     <span class="evs">${ev.slice(0,3).map(e=>`<span class="ev ${e.done?'dn2':''} ${e.pl?'pl':''}" style="--c:${e.c}">${esc(e.t)}</span>`).join('')}</span>${ev.length>3?`<span class="more">+${ev.length-3}</span>`:''}
     <span class="dots">${ev.slice(0,4).map(e=>`<i style="--c:${e.c}"></i>`).join('')}</span></button>`}).join('')}</div>${legend}
  </section>
  <section class="panel"><header><h2 class="sec" style="text-transform:capitalize">${fmtLong(S.calDay)}</h2></header>
   ${sel.length?agendaHTML(sel):`<p class="muted" style="margin:0">Wolny dzień.</p>`}
   <div class="actions"><button class="btn sm" data-act="newEvent" data-date="${S.calDay}">${icon('plus')}Wydarzenie</button><button class="btn sm" data-act="newTask" data-due="${S.calDay}">${icon('plus')}Zadanie</button><button class="btn sm" data-act="newWorkout" data-date="${S.calDay}">${icon('plus')}Trening</button>${modOn('studia')?`<button class="btn sm" data-act="newExam" data-date="${S.calDay}">${icon('plus')}Egzamin</button>`:''}</div>
  </section></div>`;
};

/* ---------- reminders ---------- */
function remindersToday(){
  const t=today(),out=[],p=plan(),d=p?.days?.[dow(t)];
  for(const x of tasks())if(x.remind&&x.time&&x.due===t&&!x.done)out.push({key:'t'+x.id+t,time:x.time,label:x.title});
  if(p?.remind&&d?.name&&d.time&&!workouts().some(w=>w.date===t)){const pl=placeOf(d.place),lv=pl?leaveAt(d.time,pl.min):'';out.push({key:'p'+t,time:lv||d.time,label:lv?`Wyjdź na trening ${d.name} (${pl.name}, start ${d.time})`:`Trening: ${d.name}`})}
  for(const v of events())if(v.date===t&&v.remind&&v.start){const lv=leaveAt(v.start,v.travel);out.push({key:'v'+v.id+t,time:lv||v.start,label:lv?`Wyjdź: ${v.title} o ${v.start} (dojazd ${v.travel} min)`:`${v.title} o ${v.start}`})}
  if(modOn('studia'))for(const e of exams())if(e.date===t&&e.time){const pl=placeOf(e.place),lv=pl?leaveAt(e.time,pl.min):'';if(lv)out.push({key:'e'+e.id+t,time:lv,label:`Wyjdź na: ${e.type} ${e.title} o ${e.time}`})}
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}
const fired=new Set();try{JSON.parse(sessionStorage.getItem('forma.fired')||'[]').forEach(k=>fired.add(k))}catch(e){}
function checkRem(){
  if(!S.loaded)return;const mins=nowMin();let ch=false;
  for(const r of remindersToday()){const m=toMin(r.time);if(mins>=m&&mins-m<60&&!fired.has(r.key)){fired.add(r.key);ch=true;toast(`${r.time} · ${r.label}`,'rem',12000);window.FORMA_PWA&&window.FORMA_PWA.notify(`${r.time} · ${r.label}`)}}
  if(ch)try{sessionStorage.setItem('forma.fired',JSON.stringify([...fired]))}catch(e){}
}

/* ---------- toast ---------- */
function toast(msg,kind='ok',ms=3800,action){
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=`${icon(kind==='err'?'info':kind==='rem'?'bell':kind==='win'?'trophy':'tick')}<span></span>${action?`<button class="ta" type="button">${esc(action.label)}</button>`:''}<button class="ib" type="button" aria-label="Zamknij">${icon('x')}</button>`;
  el.querySelector('span').textContent=msg;el.querySelector('.ib').onclick=()=>el.remove();
  if(action)el.querySelector('.ta').onclick=()=>{el.remove();action.fn()};
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),ms);
}
